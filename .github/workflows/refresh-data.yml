# Rebuilds the player data once a month from the open transfermarkt-datasets project
# and commits the new index.html if anything changed. GitHub Pages then redeploys.
# Run it by hand any time from the Actions tab ("Refresh player data" → Run workflow).
name: Refresh player data

on:
  schedule:
    - cron: "17 4 3 * *"   # 04:17 UTC on the 3rd of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas
        run: pip install pandas==2.2.3 numpy==2.1.3

      - name: Download the dataset
        run: |
          mkdir -p "$RUNNER_TEMP/tm"
          for f in players transfers clubs competitions appearances games game_lineups; do
            curl -fsSL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/tm/$f.csv.gz" \
              "https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/$f.csv.gz"
          done
          ls -la "$RUNNER_TEMP/tm"

      - name: Build the page
        run: |
          B="$RUNNER_TEMP/build"; mkdir -p "$B"
          cp tools/arcade_body.html tools/style.css "$B/"
          python3 tools/build.py "$RUNNER_TEMP/tm" tools/legends-source.html tools/countries.json "$B/data.json"
          python3 tools/build_extra.py "$RUNNER_TEMP/tm" "$B"
          python3 tools/assemble_arcade.py "$B" "$B/arcade.html"
          python3 tools/make_index.py "$B/arcade.html" index.html

      - name: Sanity check
        run: |
          # refuse to publish a broken or much smaller player list
          python3 -c "import json,sys; n=len(json.load(open('$RUNNER_TEMP/build/data.json'))['players']); print('players:', n); sys.exit(0 if n >= 5000 else 1)"

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Monthly player data refresh ($(date -u +%Y-%m-%d))"
          git push
